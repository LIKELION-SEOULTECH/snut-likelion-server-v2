# GCP GCE 배포 설정 v2
services:
  app:
    image: kimgt2828/likelion-app:latest
    container_name: snut-likelion-app
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    restart: always
    depends_on:
      - ai-chatbot
    networks:
      - likelion-net

  ai-chatbot:
    image: kayo2e/ai-chatbot:latest
    container_name: ai-chatbot
    expose:
      - "8000"
    hostname: ai.seoultech-likelion
    environment:
      TZ: Asia/Seoul
    restart: always
    networks:
      - likelion-net

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: always
    networks:
      - likelion-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  likelion-net:
