name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: google-gemini/gemini-code-review-action@v0.1.4
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pull_request_diff_url: ${{ github.event.pull_request.diff_url }}
          prompt_text: |
            당신은 Spring Boot 백엔드 코드 리뷰어입니다.
            PR의 변경사항을 분석하고 다음 항목을 한국어로 리뷰해주세요:
            1. 버그 및 잠재적 오류
            2. 코드 품질 및 가독성
            3. 보안 취약점
            4. 성능 문제
            5. 개선 제안
          exclude_patterns: |
            **/*.md
            **/*.yml
            **/generated/**
